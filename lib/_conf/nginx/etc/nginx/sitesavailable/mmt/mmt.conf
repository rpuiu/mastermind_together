# Existing server block for app.mastermindtogether.com
server {
  server_name app.mastermindtogether.com;

  location / {
    root /var/www/mmt;
    try_files $uri $uri/ =404;
  }

  location /assets {
    root /var/www/mmt;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/app.mastermindtogether.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.mastermindtogether.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP to HTTPS redirect for app.mastermindtogether.com
server {
  if ($host = app.mastermindtogether.com) {
    return 301 https://$host$request_uri;
  }

  listen 80;
  server_name app.mastermindtogether.com;
  return 404;
}

# New server block for app.apeacefultomorrow.com
server {
  server_name app.apeacefultomorrow.com;

  location / {
    proxy_pass https://app.mastermindtogether.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering on;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/app.apeacefultomorrow.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.apeacefultomorrow.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Redirect HTTP to HTTPS for app.apeacefultomorrow.com
server {
  if ($host = app.apeacefultomorrow.com) {
    return 301 https://$host$request_uri;
  }

  listen 80;
  server_name app.apeacefultomorrow.com;
  return 404;
}