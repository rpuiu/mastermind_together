server {
  server_name app.mastermindtogether.com;

  location / {
    root /var/www/mmt;
    try_files $uri $uri/ =404;
  }

  location /assets {
      root /var/www/mmt;
  }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.mastermindtogether.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.mastermindtogether.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = app.mastermindtogether.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  server_name app.mastermindtogether.com;
    return 404; # managed by Certbot


}